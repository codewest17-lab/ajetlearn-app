
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                /* style.css */
:root{
  --pri:#1565C0; --sec:#42A5F5; --acc:#26A69A;
  --bg:#F8FAFC; --bgd:#0F172A; --card:#FFFFFF; --txt:#1E293B;
  --mut:#64748B; --line:#E2E8F0; --ok:#2E7D32; --warn:#F9A825; --err:#C62828;
  --shadow:0 10px 30px rgba(15,23,42,.08); --shadow-lg:0 20px 50px rgba(15,23,42,.14);
  --r:20px; --r-sm:14px; --r-lg:26px;
  --grad-pri:linear-gradient(135deg,#1565C0,#42A5F5);
  --grad-acc:linear-gradient(135deg,#26A69A,#4DB6AC);
}
[data-theme="dark"]{
  --bg:#0F172A; --card:#1E293B; --txt:#E2E8F0; --mut:#94A3B8; --line:#334155;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#0B1220; color:var(--txt);
  display:flex;justify-content:center;min-height:100dvh;
}
h1,h2,h3,h4{font-family:'Poppins','Inter',sans-serif;line-height:1.25}
button{font-family:'Poppins',sans-serif;font-weight:600;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:'Inter',sans-serif;color:var(--txt)}
svg{display:block}
.hidden{display:none!important}

#phone{
  width:100%;max-width:430px;min-height:100dvh;background:var(--bg);
  position:relative;overflow-x:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.45);
}
#app{padding-bottom:96px;min-height:100dvh}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;z-index:200;background:var(--grad-pri);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .6s ease,transform .6s ease;
}
#splash.hide{opacity:0;transform:scale(1.06);pointer-events:none}
.splash-core{text-align:center;color:#fff}
.atom-wrap{width:150px;height:150px;margin:0 auto 28px;position:relative}
.atom-core-dot{
  position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff,#90CAF9);
  box-shadow:0 0 30px rgba(255,255,255,.8);animation:pulse 1.6s ease-in-out infinite;
}
.orbit{position:absolute;inset:0;border:2px solid rgba(255,255,255,.35);border-radius:50%}
.o1{animation:spin 3.2s linear infinite}
.o2{transform:rotate(60deg) scaleY(.55);animation:spin 4.4s linear infinite reverse}
.o3{transform:rotate(-60deg) scaleY(.55);animation:spin 5.6s linear infinite}
.electron{position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.o2{animation-name:spin2}@keyframes spin2{from{transform:rotate(60deg) scaleY(.55)}to{transform:rotate(420deg) scaleY(.55)}}
.o3{animation-name:spin3}@keyframes spin3{from{transform:rotate(-60deg) scaleY(.55)}to{transform:rotate(300deg) scaleY(.55)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.splash-title{font-size:2.3rem;font-weight:700;letter-spacing:.5px}
.splash-tag{margin-top:6px;opacity:.9;font-size:.95rem}
.splash-bar{width:180px;height:5px;background:rgba(255,255,255,.25);border-radius:99px;margin:30px auto 12px;overflow:hidden}
#splash-fill{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .3s ease}
.splash-status{font-size:.8rem;opacity:.85}

/* ---------- Screens ---------- */
.screen{padding:20px 18px 12px;animation:screenIn .38s cubic-bezier(.22,.9,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stagger>*{opacity:0;animation:screenIn .45s cubic-bezier(.22,.9,.3,1) forwards}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.11s}.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.19s}.stagger>*:nth-child(6){animation-delay:.23s}
.stagger>*:nth-child(7){animation-delay:.27s}.stagger>*:nth-child(8){animation-delay:.31s}
.stagger>*:nth-child(9){animation-delay:.35s}.stagger>*:nth-child(10){animation-delay:.39s}

/* ---------- Header ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.topbar h2{font-size:1.25rem;flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--shadow);color:var(--txt);transition:transform .15s,background .2s;flex:none;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn.primary{background:var(--grad-pri);color:#fff}
.icon-btn.active{background:var(--grad-pri);color:#fff}
.icon-btn svg{width:20px;height:20px}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.tight{padding:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-head h3{font-size:1.02rem}
.link-btn{color:var(--pri);font-size:.85rem;display:flex;align-items:center;gap:4px}
[data-theme="dark"] .link-btn{color:var(--sec)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:16px;font-size:.95rem;
  background:var(--grad-pri);color:#fff;box-shadow:0 8px 20px rgba(21,101,192,.35);
  transition:transform .15s,box-shadow .2s,filter .2s;width:100%;
}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.btn.acc{background:var(--grad-acc);box-shadow:0 8px 20px rgba(38,166,154,.35)}
.btn.small{padding:10px 16px;font-size:.85rem;width:auto;border-radius:13px}
.btn.danger{background:linear-gradient(135deg,#C62828,#E53935);box-shadow:0 8px 20px rgba(198,40,40,.3)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:18px;height:18px}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:.75rem;font-weight:600;background:rgba(21,101,192,.1);color:var(--pri)}
[data-theme="dark"] .chip{background:rgba(66,165,245,.15);color:var(--sec)}
.chip.acc{background:rgba(38,166,154,.12);color:var(--acc)}
.chip.warn{background:rgba(249,168,37,.15);color:#B26A00}
[data-theme="dark"] .chip.warn{color:var(--warn)}

/* ---------- Home ---------- */
.greet-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.greet-hi{font-size:.85rem;color:var(--mut)}
.greet-name{font-size:1.45rem;font-weight:700}
.greet-date{font-size:.78rem;color:var(--mut);margin-top:2px}
.logo-badge{width:44px;height:44px;border-radius:15px;background:var(--grad-pri);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px rgba(21,101,192,.35)}
.logo-badge svg{width:24px;height:24px}

.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;
  padding:13px 16px;box-shadow:var(--shadow);color:var(--mut);cursor:pointer;margin-bottom:18px;
  transition:transform .15s;
}
.searchbar:active{transform:scale(.98)}
.searchbar svg{width:19px;height:19px}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:.92rem}

.hero-card{
  background:var(--grad-pri);border-radius:var(--r-lg);padding:20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 16px 34px rgba(21,101,192,.4);margin-bottom:18px;
}
.hero-card::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-card::before{content:"";position:absolute;right:22px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-kicker{font-size:.72rem;letter-spacing:1.4px;text-transform:uppercase;opacity:.85;font-weight:600}
.hero-title{font-size:1.15rem;margin:7px 0 4px;font-weight:600}
.hero-sub{font-size:.8rem;opacity:.9;margin-bottom:14px}
.hero-btn{
  background:#fff;color:var(--pri);border-radius:13px;padding:10px 18px;font-size:.85rem;
  display:inline-flex;align-items:center;gap:7px;position:relative;z-index:1;transition:transform .15s;
}
.hero-btn:active{transform:scale(.94)}

.daily-row{display:flex;gap:12px;margin-bottom:6px}
.daily-card{flex:1;display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:70px;height:70px;flex:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.ring-txt small{font-size:.55rem;color:var(--mut);font-weight:500}
.daily-info h4{font-size:.92rem;margin-bottom:3px}
.daily-info p{font-size:.76rem;color:var(--mut);line-height:1.4}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}

.recent-card{width:200px;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.recent-card:active{transform:scale(.96)}
.recent-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.subj-dot{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.subj-dot svg{width:16px;height:16px}
.recent-card h5{font-size:.85rem;line-height:1.35;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.mini-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar span{display:block;height:100%;border-radius:99px;background:var(--grad-pri);transition:width .8s ease}
.recent-pct{font-size:.7rem;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}

.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj-card{
  border-radius:var(--r);padding:18px 16px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .15s;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;
}
.subj-card:active{transform:scale(.96)}
.subj-card::after{content:"";position:absolute;right:-28px;bottom:-28px;width:95px;height:95px;border-radius:50%;background:rgba(255,255,255,.15)}
.subj-card .sc-ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.subj-card .sc-ic svg{width:20px;height:20px}
.subj-card h4{margin-top:14px;font-size:1rem}
.subj-card p{font-size:.72rem;opacity:.9;margin:2px 0 8px}
.sc-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;position:relative;z-index:1}
.sc-bar span{display:block;height:100%;background:#fff;border-radius:99px}

.short-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shortcut{
  background:var(--card);border-radius:var(--r-sm);padding:14px 6px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;
}
.shortcut:active{transform:scale(.92)}
.shortcut .sh-ic{width:38px;height:38px;border-radius:12px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.shortcut .sh-ic svg{width:19px;height:19px}
.shortcut span{font-size:.7rem;font-weight:600}

.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-box{background:var(--card);border-radius:var(--r-sm);padding:13px 6px;text-align:center;box-shadow:var(--shadow)}
.stat-box b{font-size:1.05rem;display:block;color:var(--pri)}
[data-theme="dark"] .stat-box b{color:var(--sec)}
.stat-box span{font-size:.62rem;color:var(--mut);font-weight:500}

/* ---------- Subject screen ---------- */
.subj-hero{border-radius:var(--r-lg);padding:22px 20px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-lg)}
.subj-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13)}
.subj-hero .sh-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subj-hero h2{font-size:1.35rem}
.subj-hero p{font-size:.82rem;opacity:.92;max-width:88%}
.subj-hero .sh-stats{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.sh-pill{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;font-size:.72rem;font-weight:600}

.filter-in{
  display:flex;align-items:center;gap:10px;background:var(--card);border-radius:15px;
  padding:11px 15px;box-shadow:var(--shadow);margin-bottom:14px;
}
.filter-in svg{width:18px;height:18px;color:var(--mut);flex:none}
.filter-in input{flex:1;border:none;outline:none;background:none;font-size:.9rem}

.cat-head{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.cat-num{width:30px;height:30px;border-radius:10px;background:var(--grad-pri);color:#fff;font-size:.78rem;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cat-head h4{font-size:.92rem;flex:1}
.cat-head small{color:var(--mut);font-size:.7rem}

.topic-row{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-sm);
  padding:13px 14px;box-shadow:var(--shadow);margin-bottom:9px;cursor:pointer;transition:transform .15s;
}
.topic-row:active{transform:scale(.98)}
.topic-num{width:34px;height:34px;border-radius:11px;background:rgba(21,101,192,.09);color:var(--pri);font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
[data-theme="dark"] .topic-num{background:rgba(66,165,245,.14);color:var(--sec)}
.topic-row.done .topic-num{background:rgba(46,125,50,.12);color:var(--ok)}
.topic-row h5{font-size:.88rem;font-weight:600;line-height:1.3}
.topic-row small{font-size:.7rem;color:var(--mut)}
.topic-meta{flex:1;min-width:0}
.t-check{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.t-check svg{width:13px;height:13px;color:#fff}
.topic-row.done .t-check{background:var(--ok);border-color:var(--ok)}
.t-bm{color:var(--warn)}
.t-bm svg{width:16px;height:16px}

/* ---------- Lesson ---------- */
.lesson-hero{border-radius:var(--r-lg);padding:22px 20px 20px;color:#fff;margin-bottom:8px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.lesson-hero::after{content:"";position:absolute;right:-44px;bottom:-52px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.lesson-hero .chip{background:rgba(255,255,255,.2);color:#fff}
.lesson-hero h2{font-size:1.3rem;margin:12px 0 8px;position:relative;z-index:1}
.lesson-meta{display:flex;gap:14px;font-size:.75rem;opacity:.92}
.lesson-meta span{display:flex;align-items:center;gap:5px}
.lesson-meta svg{width:14px;height:14px}

.lesson-sec{margin-top:22px}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-title .s-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-title .s-ic svg{width:17px;height:17px}
.sec-title h3{font-size:1rem}
.sec-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:17px;line-height:1.65;font-size:.9rem}
.sec-card p{margin-bottom:10px}
.sec-card p:last-child{margin-bottom:0}

.def-card{border-left:4px solid var(--acc);background:linear-gradient(135deg,rgba(38,166,154,.09),transparent),var(--card)}
.concept-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.concept-item:last-child{border-bottom:none;padding-bottom:0}
.concept-item:first-child{padding-top:0}
.c-dot{width:24px;height:24px;border-radius:8px;background:rgba(21,101,192,.1);color:var(--pri);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
[data-theme="dark"] .c-dot{background:rgba(66,165,245,.15);color:var(--sec)}
.concept-item p{font-size:.88rem}

.formula-box{
  background:linear-gradient(135deg,#0F172A,#1E293B);color:#E2E8F0;border-radius:var(--r);
  padding:20px;text-align:center;font-size:1.25rem;font-weight:600;font-family:'Poppins',monospace;
  letter-spacing:.5px;box-shadow:var(--shadow);
}
.formula-box small{display:block;font-size:.7rem;color:#94A3B8;margin-top:8px;font-weight:500;letter-spacing:.3px}

.example-step{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--grad-acc);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.example-q{font-weight:600;background:rgba(249,168,37,.12);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:.9rem}
.example-ans{margin-top:10px;background:rgba(46,125,50,.1);border-radius:12px;padding:12px 14px;font-weight:600;color:var(--ok);font-size:.9rem}

.app-item,.mis-item{display:flex;gap:11px;padding:10px 0;align-items:flex-start;border-bottom:1px dashed var(--line)}
.app-item:last-child,.mis-item:last-child{border-bottom:none}
.app-item .a-ic,.mis-item .m-ic{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.app-item .a-ic svg,.mis-item .m-ic svg{width:14px;height:14px}
.app-item .a-ic{background:rgba(38,166,154,.12);color:var(--acc)}
.mis-item .m-ic{background:rgba(198,40,40,.1);color:var(--err)}
.app-item p,.mis-item p{font-size:.87rem}

.diagram-box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.diagram-box svg{width:100%;height:auto}
.diagram-cap{font-size:.72rem;color:var(--mut);text-align:center;margin-top:8px}

.lesson-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.pager-row{display:flex;gap:10px;margin-top:12px}
.pager-row .btn{flex:1}

/* ---------- Quiz ---------- */
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quiz-dots{display:flex;gap:6px;flex:1;justify-content:center}
.q-dot{width:22px;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.q-dot.cur{background:var(--pri)}
.q-dot.done{background:var(--acc)}
.quiz-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:22px;animation:screenIn .35s ease}
.q-count{font-size:.72rem;color:var(--mut);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.quiz-card h3{font-size:1.05rem;margin:10px 0 18px;line-height:1.45}
.q-opt{
  width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:15px;
  padding:14px 15px;font-size:.88rem;font-family:'Inter';font-weight:500;margin-bottom:10px;
  display:flex;gap:11px;align-items:flex-start;transition:all .2s;line-height:1.45;
}
.q-opt .opt-l{width:24px;height:24px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex:none;color:var(--mut)}
.q-opt:not(:disabled):active{transform:scale(.98)}
.q-opt.correct{background:rgba(46,125,50,.1);border-color:var(--ok);color:var(--ok)}
.q-opt.correct .opt-l{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-opt.wrong{background:rgba(198,40,40,.08);border-color:var(--err);color:var(--err)}
.q-opt.wrong .opt-l{background:var(--err);color:#fff;border-color:var(--err)}
.q-opt.dim{opacity:.5}
.q-why{background:rgba(38,166,154,.1);border-radius:13px;padding:12px 14px;font-size:.82rem;line-height:1.55;margin:6px 0 12px;animation:screenIn .3s ease}
.q-why b{color:var(--acc)}

.result-wrap{text-align:center;padding:14px 0}
.result-ring{margin:0 auto 18px}
.result-wrap h3{font-size:1.3rem;margin-bottom:6px}
.result-wrap p{color:var(--mut);font-size:.88rem;margin-bottom:20px;line-height:1.5}
.result-badges{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.r-badge{background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);font-size:.78rem}
.r-badge b{display:block;font-size:1.05rem;color:var(--pri)}

/* ---------- Dashboard ---------- */
.dash-hero{background:var(--grad-acc);border-radius:var(--r-lg);padding:20px;color:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 14px 30px rgba(38,166,154,.35);margin-bottom:16px;position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.dash-hero h4{font-size:1rem;margin-bottom:2px}
.dash-hero p{font-size:.78rem;opacity:.92}
.week-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:8px 4px 0}
.w-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.w-bar .bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--line);transition:height .8s cubic-bezier(.22,.9,.3,1);min-height:4px}
.w-bar.today .bar{background:var(--grad-pri)}
.w-bar span{font-size:.62rem;color:var(--mut);font-weight:600}
.w-bar b{font-size:.62rem;color:var(--txt)}
.subj-prog-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.subj-prog-row:last-child{border-bottom:none}
.subj-prog-row .sp-info{flex:1}
.subj-prog-row h5{font-size:.86rem;margin-bottom:6px}
.subj-prog-row small{font-size:.7rem;color:var(--mut)}

/* ---------- Lists (bookmarks/notes/search) ---------- */
.empty-state{text-align:center;padding:52px 24px}
.empty-state .e-ic{width:72px;height:72px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--mut)}
.empty-state .e-ic svg{width:32px;height:32px}
.empty-state h4{margin-bottom:6px}
.empty-state p{color:var(--mut);font-size:.85rem;line-height:1.55}
.note-prev{font-size:.8rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;line-height:1.5}
.res-group{margin-bottom:18px}
.res-group>h4{font-size:.8rem;color:var(--mut);margin-bottom:8px;letter-spacing:.6px;text-transform:uppercase}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .s-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.set-row .s-ic svg{width:19px;height:19px}
.set-row .s-txt{flex:1}
.set-row h5{font-size:.9rem}
.set-row small{font-size:.72rem;color:var(--mut)}
.switch{width:50px;height:29px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(21px)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--bg);box-shadow:var(--shadow);font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.stepper b{min-width:26px;text-align:center}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;box-shadow:inset 0 1px 4px rgba(0,0,0,.06)}
.seg button{padding:7px 13px;border-radius:9px;font-size:.78rem;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow);font-weight:700}
input[type=range]{width:120px;accent-color:var(--pri)}

/* ---------- Tabbar ---------- */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 8px calc(11px + env(safe-area-inset-bottom));
  z-index:90;transition:transform .3s ease;
}
#tabbar.hidden{transform:translate(-50%,110%)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;color:var(--mut);padding:5px 14px;border-radius:14px;transition:all .25s}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--pri);background:rgba(21,101,192,.1)}
[data-theme="dark"] .tab.on{color:var(--sec);background:rgba(66,165,245,.14)}

/* ---------- Onboarding ---------- */
.onb{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;max-width:430px;margin:0 auto;left:0;right:0}
.onb-slides{flex:1;display:flex;transition:transform .5s cubic-bezier(.22,.9,.3,1)}
.onb-slide{width:100%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 34px;text-align:center}
.onb-art{width:min(260px,70vw);margin-bottom:34px}
.onb-slide h2{font-size:1.5rem;margin-bottom:12px}
.onb-slide p{color:var(--mut);font-size:.92rem;line-height:1.65;max-width:320px}
.onb-foot{padding:10px 24px calc(26px + env(safe-area-inset-bottom))}
.onb-dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.o-dot{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .3s}
.o-dot.on{width:24px;background:var(--pri)}
.onb-btns{display:flex;gap:12px;align-items:center}
.onb-btns .btn{flex:1}
.skip-btn{color:var(--mut);font-size:.88rem;padding:13px 8px}

/* ---------- Modal / Toast ---------- */
.modal-veil{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:180;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{
  width:100%;max-width:430px;background:var(--card);border-radius:26px 26px 0 0;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:slideUp .35s cubic-bezier(.22,.9,.3,1);
  max-height:86dvh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}}
.modal h3{margin-bottom:14px}
.modal textarea{width:100%;min-height:130px;border:2px solid var(--line);border-radius:14px;padding:13px;font-size:.9rem;resize:vertical;outline:none;background:var(--bg)}
.modal textarea:focus{border-color:var(--sec)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns .btn{flex:1}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
#toast{
  position:fixed;bottom:104px;left:50%;transform:translate(-50%,20px);background:#0F172A;color:#fff;
  padding:11px 20px;border-radius:99px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:190;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:92%;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Search ---------- */
.search-page-in{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:13px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.search-page-in input{flex:1;border:none;outline:none;background:none;font-size:.95rem}
.search-page-in svg{width:19px;height:19px;color:var(--mut)}

@media (min-width:480px){
  body{padding:24px 0}
  #phone{border-radius:36px;min-height:calc(100dvh - 48px);overflow:hidden;border:1px solid #1E293B}
  #splash,.onb{border-radius:36px;max-width:430px;left:50%;transform:translateX(-50%)}
  #splash.hide{transform:translateX(-50%) scale(1.06)}
}

"use strict";

/* ---------- Global namespace ---------- */
window.Ajet = { subjects: [], state: null };

/* ---------- Tiny DOM helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);

const esc = (str) => String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

/* ---------- Seeded RNG ---------- */
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function seededShuffle(arr, rnd) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Icons (inline SVG, feather style) ---------- */
const ICONS = {

  speaker: '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9.4 9.4 0 0 1 0 13"/>',
  check: '<path d="m4.5 12.5 5 5 10-11"/>',

  flame: '<path d="M12 22c4.4 0 7-2.8 7-6.7 0-2.5-1.3-4.6-2.9-6.3-.4 1.1-1.2 2-2.1 2.4.3-2.8-1-6-3.8-7.4.3 2.4-.5 3.7-1.7 5C7.2 10.6 5 12.4 5 15.3 5 19.2 7.6 22 12 22z"/>',

  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',

  atom: '<circle cx="12" cy="12" r="1.4"/><ellipse cx="12" cy="12" rx="10" ry="4.2"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-60 12 12)"/>',

  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/>',
  bulb: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v6"/>',
  layers: '<path d="m12 2 10 6-10 6L2 8z"/><path d="m2 14 10 6 10-6"/>',
  bolt: '<path d="M13 2 3 14h8l-1 8 10-12h-8z"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  wave: '<path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3-4.5 5-3"/>',

};
function icon(name, size = 20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* ---------- Persistent state ---------- */
const STORE_KEY = "ajetlearn_v2";
const DEFAULT_STATE = {
  onboarded: false, dark: false, fontScale: 1, voiceRate: 1, dailyGoal: 5,
  done: {}, best: {}, bookmarks: {}, notes: {}, recent: [], days: {},
  minutes: 0, streak: 0, lastDay: null
};
function loadState() {
  try { return Object.assign({}, DEFAULT_STATE, JSON.parse(localStorage.getItem(STORE_KEY) || "{}")); }
  catch (e) { return Object.assign({}, DEFAULT_STATE); }
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(Ajet.state)); } catch (e) {} }
function todayKey(d = new Date()) { return d.toISOString().slice(0, 10); }

function addStudy(minutes) {
  const st = Ajet.state, k = todayKey();
  st.days[k] = (st.days[k] || 0) + 1;
  st.minutes += minutes;
  if (st.lastDay !== k) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    st.streak = (st.lastDay === todayKey(y)) ? st.streak + 1 : 1;
    st.lastDay = k;
  }
  saveState();
}
function markDone(id) {
  const st = Ajet.state;
  if (st.done[id]) return false;
  st.done[id] = { t: Date.now() };
  touchRecent(id);
  addStudy((DB.topics[id] && DB.topics[id].mins) || 6);
  return true;
}
function touchRecent(id) {
  const st = Ajet.state;
  st.recent = [id, ...st.recent.filter(r => r !== id)].slice(0, 12);
  saveState();
}

/* ---------- Subject database ---------- */
const DB = { topics: {}, count: 0 };
function buildDB() {
  Ajet.subjects.forEach(s => {
    s.topics.forEach((t, i) => {
      const id = s.key + "-" + (i + 1);
      const o = {
        id, n: i + 1, subj: s, title: t[0], cat: t[1], def: t[2], points: t[3],
        formula: t[4], ex: t[5]
      };
      o.mins = Math.max(4, Math.round((o.def.length + o.points.join(" ").length + (o.ex || "").length) / 620) + 4);
      o.catObj = s.cats[o.cat];
      DB.topics[id] = o;
    });
    DB.count += s.topics.length;
  });
}
const subjOf = (id) => id.split("-")[0];
function subjProgress(key) {
  const s = Ajet.subjects.find(x => x.key === key);
  const done = s.topics.filter((_, i) => Ajet.state.done[key + "-" + (i + 1)]).length;
  return { done, total: s.topics.length, pct: Math.round((done / s.topics.length) * 100) };
}
function parseExample(ex) {
  if (!ex) return null;
  const parts = ex.split(";;");
  if (parts.length >= 3) return { q: parts[0], steps: parts.slice(1, -1), ans: parts[parts.length - 1] };
  return { q: parts[0], steps: [], ans: parts[1] || "" };
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2300);
}

/* ---------- Router ---------- */
const hist = [];
function render(view, params = {}) {
  const fn = Views[view] || Views.home;
  $("#app").innerHTML = fn(params);
  $("#app").scrollTop = 0;
  window.scrollTo({ top: 0 });
  if (fn.after) fn.after(params);
  updateTabbar(view);
}
function go(view, params = {}, push = true) {
  if (push) { hist.push({ view, params }); try { history.pushState({ n: hist.length }, ""); } catch (e) {} }
  render(view, params);
}
function goBack() { if (hist.length > 1) history.back(); else go("home", {}, false); }
window.addEventListener("popstate", () => {
  if (hist.length > 1) { hist.pop(); const cur = hist[hist.length - 1]; render(cur.view, cur.params); }
});
const MAIN_VIEWS = ["home", "subjects", "dashboard", "settings"];
function updateTabbar(view) {
  $("#tabbar").classList.toggle("hidden", !MAIN_VIEWS.includes(view));
  $$(".tab").forEach(b => b.classList.toggle("on", b.dataset.view === view));
}

/* ---------- Text-to-speech ---------- */
const TTS = { speaking: false, paused: false };
function ttsAvailable() { return "speechSynthesis" in window; }
function speakText(text, onEnd) {
  if (!ttsAvailable()) { toast("Voice reading is not supported on this device"); return; }
  stopSpeak();
  const chunks = text.match(/[^.!?]+[.!?]*/g) || [text];
  let queue = [];
  chunks.forEach(c => { if ((queue.join(" ") + c).length > 210 && queue.length) { /* keep sentence granularity */ } queue.push(c); });
  const utterances = [];
  let buf = "";
  chunks.forEach(c => {
    if ((buf + c).length > 220) { utterances.push(buf); buf = c; } else buf += c;
  });
  if (buf.trim()) utterances.push(buf);
  utterances.forEach((u, i) => {
    const ut = new SpeechSynthesisUtterance(u.trim());
    ut.rate = Ajet.state.voiceRate; ut.pitch = 1;
    if (i === utterances.length - 1) ut.onend = () => { TTS.speaking = false; if (onEnd) onEnd(); };
    speechSynthesis.speak(ut);
  });
  TTS.speaking = true; TTS.paused = false;
}
function stopSpeak() { if (ttsAvailable()) speechSynthesis.cancel(); TTS.speaking = false; TTS.paused = false; }
function pauseSpeak() { if (ttsAvailable()) { speechSynthesis.pause(); TTS.paused = true; } }
function resumeSpeak() { if (ttsAvailable()) { speechSynthesis.resume(); TTS.paused = false; } }

/* ---------- Modal ---------- */
function openModal(html) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-veil"><div class="modal"><div class="grab"></div>${html}</div></div>`;
  $(".modal-veil", root).addEventListener("click", (e) => { if (e.target.classList.contains("modal-veil")) closeModal(); });
}
function closeModal() { $("#modal-root").innerHTML = ""; }
function confirmModal(title, body, okLabel, onOk, danger = true) {
  openModal(`<h3>${esc(title)}</h3><p style="color:var(--mut);font-size:.9rem;line-height:1.6;margin-bottom:4px">${esc(body)}</p>
  <div class="modal-btns"><button class="btn ghost" id="cm-cancel">Cancel</button><button class="btn ${danger ? "danger" : ""}" id="cm-ok">${esc(okLabel)}</button></div>`);
  $("#cm-cancel").onclick = closeModal;
  $("#cm-ok").onclick = () => { closeModal(); onOk(); };
}

/* js/render.js - screen renderers, quiz engine, diagrams */
"use strict";
const Views = {};

/* ---------- Shared components ---------- */
const RING_GRAD = `<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1565C0"/><stop offset="100%" stop-color="#26A69A"/></linearGradient></defs>`;
function ring(pct, size = 70, label, sub) {
  const r = (size - 10) / 2, c = 2 * Math.PI * r;
  const off = c - (Math.min(100, pct) / 100) * c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">${RING_GRAD}
      <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="7"/>
      <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="7" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg><div class="ring-txt">${label}<small>${sub || ""}</small></div></div>`;
}
function subjIcon(key, size = 20) { const s = Ajet.subjects.find(x => x.key === key); return icon(s ? s.icon : "book", size); }
function subjColor(key) { const s = Ajet.subjects.find(x => x.key === key); return s ? s.color : "#1565C0"; }
function topbarHTML(title, left = "back", right = "") {
  return `<div class="topbar"><button class="icon-btn" data-act="back">${icon(left)}</button><h2>${esc(title)}</h2>${right}</div>`;
}

function topicListHTML(s, filter) {
  const q = filter.toLowerCase();
  let html = "";
  s.cats.forEach((c, ci) => {
    const rows = s.topics.map((t, i) => ({ t, id: s.key + "-" + (i + 1), n: i + 1 })).filter(o => o.t[1] === ci && (!q || o.t[0].toLowerCase().includes(q)));
    if (!rows.length) return;
    html += `<div class="cat-head"><span class="cat-num">${ci + 1}</span><h4>${esc(c.n)}</h4><small>${rows.length} lessons</small></div>`;
    rows.forEach(o => {
      const done = !!Ajet.state.done[o.id], bm = !!Ajet.state.bookmarks[o.id];
      html += `<div class="topic-row ${done ? "done" : ""}" data-open="${o.id}">
        <span class="topic-num">${done ? icon("check", 14) : o.n}</span>
        <div class="topic-meta"><h5>${esc(o.t[0])}</h5><small>${DB.topics[o.id].mins} min read${bm ? " - Bookmarked" : ""}</small></div>

    });
  });
  return html || `<div class="empty-state"><div class="e-ic">${icon("search")}</div><h4>No lessons found</h4><p>Try a different search term.</p></div>`;
}

/* ---------- Quiz ---------- */
function buildQuiz(t) {
  const rnd = mulberry32(strHash(t.id + "q"));
  const others = seededShuffle(t.subj.topics.map((x, i) => ({ ...x, id: t.subj.key + "-" + (i + 1) })).filter(o => o.id !== t.id), rnd);
  const qs = [];
  const mkOpts = (correct, distractors, why) => {
    const opts = seededShuffle([correct, ...distractors.slice(0, 3)], rnd);
    return { opts, a: opts.indexOf(correct), why };
  };
  // Q1: definition
  qs.push({ q: `Which statement best describes ${t.title}?`, ...mkOpts(t.def, others.map(o => o.def), `<b>${t.title}:</b> ${esc(t.def)}`) });
  // Q2: key concept
  const pt = t.points[Math.floor(rnd() * t.points.length)];
  const otherPts = seededShuffle(others.flatMap(o => o[3]), rnd).filter(p => p && p !== pt);
  qs.push({ q: `Which of these is a key concept of ${t.title}?`, ...mkOpts(pt, otherPts, `This idea is central to ${esc(t.title.toLowerCase())}.`) });
  // Q3: formula or category
  if (t.formula) {
    const otherF = seededShuffle(others.filter(o => o[4]).map(o => o[4]), rnd);
    qs.push({ q: `Which formula belongs to ${t.title}?`, ...mkOpts(t.formula, otherF, `The key formula is ${esc(t.formula)}.`) });
  } else {
    const pt2 = t.points.find(p => p !== pt);
    qs.push({ q: `Which statement is also true about ${t.title}?`, ...mkOpts(pt2, otherPts, `This is another core idea of ${esc(t.title.toLowerCase())}.`) });
  }
  // Q4: unit
  const catNames = t.subj.cats.map(c => c.n).filter(n => n !== t.catObj.n);
  qs.push({ q: `In which ${t.subj.name} unit is ${t.title} studied?`, ...mkOpts(t.catObj.n, seededShuffle(catNames, rnd), `It belongs to the ${esc(t.catObj.n)} unit.`) });
  // Q5: another definition
  const t2 = others[5] || others[1];
  qs.push({ q: `Which topic matches this description: "${esc(t2.def)}"`, ...mkOpts(t2.title, seededShuffle(others.filter(o => o.id !== t2.id).map(o => o.title), rnd), `That definition belongs to ${esc(t2.title)}.`) });
  return qs;
}
Views.quiz = function ({ id }) {
  const t = DB.topics[id];
  return `<div class="screen" id="quiz-root" data-tid="${id}">
    <div class="quiz-head"><button class="icon-btn" data-act="back">${icon("x")}</button>

Views.quiz.after = function ({ id }) {
  const t = DB.topics[id], qs = buildQuiz(t);
  let qi = 0, score = 0, answered = false;
  const dots = $("#q-dots");
  const drawDots = () => { dots.innerHTML = qs.map((_, i) => `<span class="q-dot ${i === qi ? "cur" : i < qi ? "done" : ""}"></span>`).join(""); };
  const drawQ = () => {
    answered = false;
    const q = qs[qi];
    $("#quiz-body").innerHTML = `<div class="quiz-card">
      <p class="q-count">Question ${qi + 1} of ${qs.length}</p>
      <h3>${q.q}</h3>
      ${q.opts.map((o, i) => `<button class="q-opt" data-i="${i}"><span class="opt-l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
      <div id="q-why-slot"></div><div id="q-next-slot"></div></div>`;
    $$(".q-opt").forEach(b => b.onclick = () => answer(parseInt(b.dataset.i, 10)));
    drawDots();
  };
  const answer = (i) => {
    if (answered) return; answered = true;
    const q = qs[qi], opts = $$(".q-opt");
    opts.forEach((b, bi) => {
      b.disabled = true;
      if (bi === q.a) b.classList.add("correct");
      else if (bi === i) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    if (i === q.a) { score++; $("#q-score-chip").textContent = score + " pts"; }
    $("#q-why-slot").innerHTML = `<div class="q-why">${i === q.a ? "<b>Correct.</b> " : "<b>Not quite.</b> "}${q.why}</div>`;
    $("#q-next-slot").innerHTML = `<button class="btn" id="q-next">${qi === qs.length - 1 ? "See Results" : "Next Question"} ${icon("arrowR", 16)}</button>`;
    $("#q-next").onclick = () => { if (qi < qs.length - 1) { qi++; drawQ(); } else results(); };
  };
  const results = () => {
    const pct = Math.round((score / qs.length) * 100);
    const prevBest = Ajet.state.best[id] || 0;
    if (pct > prevBest) Ajet.state.best[id] = pct;
    const passed = score >= Math.ceil(qs.length * 0.6);
    if (passed && markDone(id)) {}
    saveState();
    const msg = pct === 100 ? "Perfect score. You have mastered this lesson." : pct >= 80 ? "Excellent understanding. Keep this momentum going." : pct >= 60 ? "Good effort. Review the lesson to close the gaps." : "Keep practising. Re-read the lesson and try again.";
    $("#quiz-body").innerHTML = `<div class="quiz-card result-wrap">
      <div class="result-ring">${ring(pct, 130, pct + "%", "score")}</div>
      <h3>${pct >= 60 ? "Lesson Quiz Passed" : "Quiz Complete"}</h3><p>${msg}</p>
      <div class="result-badges"><div class="r-badge"><b>${score}/${qs.length}</b>correct answers</div>
      <div class="r-badge"><b>${Math.max(pct, prevBest)}%</b>best score</div></div>
      <button class="btn" data-open="${id}">${icon("book")} Back to Lesson</button>
      <div style="height:10px"></div>
      <button class="btn ghost" id="retry">${icon("refresh")} Retake Quiz</button></div>`;
    $("#retry").onclick = () => go("quiz", { id }, false);
    toast(pct >= 60 ? "Progress saved" : "Score recorded");
  };
  drawQ();
};

/* js/app.js - boot, global events, service worker */
"use strict";

function applyTheme() {
  document.documentElement.dataset.theme = Ajet.state.dark ? "dark" : "light";
  document.documentElement.style.fontSize = (16 * Ajet.state.fontScale) + "px";
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", Ajet.state.dark ? "#0F172A" : "#1565C0");
}

function bindGlobal() {
  document.addEventListener("click", (e) => {
    const openEl = e.target.closest("[data-open]");
    if (openEl) { stopSpeak(); go("lesson", { id: openEl.dataset.open }); return; }
    const quizEl = e.target.closest("[data-quiz]");
    if (quizEl) { stopSpeak(); go("quiz", { id: quizEl.dataset.quiz }); return; }
    const subjEl = e.target.closest("[data-subj]");
    if (subjEl) { go("subject", { key: subjEl.dataset.subj }); return; }
    const goEl = e.target.closest("[data-go]");
    if (goEl) { stopSpeak(); go(goEl.dataset.go, {}); return; }
    const backEl = e.target.closest('[data-act="back"]');
    if (backEl) { stopSpeak(); goBack(); return; }
  });
  $$(".tab").forEach(b => b.addEventListener("click", () => { stopSpeak(); go(b.dataset.view, {}); }));
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.deferredPrompt = e; });
}

function splashBoot() {
  const fill = $("#splash-fill"), status = $("#splash-status");
  const steps = [[25, "Loading 400 lessons..."], [55, "Preparing subjects..."], [82, "Warming up the lab..."], [100, "Ready."]];
  steps.forEach(([w, txt], i) => setTimeout(() => { fill.style.width = w + "%"; status.textContent = txt; }, 380 * (i + 1)));
  setTimeout(() => {
    $("#splash").classList.add("hide");
    setTimeout(() => { $("#splash").style.display = "none"; }, 650);
    if (!Ajet.state.onboarded) { hist.push({ view: "onboarding", params: {} }); render("onboarding"); }
    else { hist.push({ view: "home", params: {} }); render("home"); try { history.replaceState({ n: 1 }, ""); } catch (e) {} }
  }, 2400);
}

function registerSW() {
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").then(() => console.log("AjetLearn service worker registered")).catch(() => {});
  }
}

document.addEventListener("DOMContentLoaded", () => {
  Ajet.state = loadState();
  buildDB();
  applyTheme();
  bindGlobal();
  registerSW();
  splashBoot();
});

/* sw.js - AjetLearn service worker for full offline use */
const CACHE = "ajetlearn-v1";
const ASSETS = [
  "./", "index.html", "style.css",
  "js/core.js", "js/render.js", "js/app.js",
  "data/physics.js", "data/chemistry.js", "data/biology.js", "data/mathematics.js",
  "manifest.webmanifest"
];
self.addEventListener("install", (event) => {
  event.waitUntil(caches.open(CACHE).then((c) => c.addAll(ASSETS)).then(() => self.skipWaiting()));
});
self.addEventListener("activate", (event) => {
  event.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
});
self.addEventListener("fetch", (event) => {
  if (event.request.method !== "GET") return;
  event.respondWith(
    caches.match(event.request, { ignoreSearch: true }).then((hit) => {
      if (hit) return hit;
      return fetch(event.request).then((res) => {
        const copy = res.clone();
        if (res.ok && (res.type === "basic" || res.type === "cors")) caches.open(CACHE).then((c) => c.put(event.request, copy));
        return res;
      }).catch(() => caches.match("index.html"));
    })
  );
});
